<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Webpage</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
      color: #1f2937;
    }
    main {
      width: min(90%, 600px);
      padding: 40px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0,0,0,.12);
    }
    h1 { color: #4f46e5; }
    p { line-height: 1.6; }
    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #3730a3; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to My Webpage!</h1>
    <p>This is a simple HTML page with a little CSS styling and a button.</p>
    <button onclick="showMessage()">Click Me</button>
  </main>

  <script>
    function showMessage() {
      alert("Hello! Your HTML page is working.");
    }
  </script>
</body>
</html>
